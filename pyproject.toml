[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zfcssh-client"
version = "0.1.0"
description = "Linux PC endpoint agent for mTLS-authenticated SSH certificate enrollment and certificate-based SSH access"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.2.0,<9.0.0",
]

[project.scripts]
zfcssh = "zfcssh_client.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests_client"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
include = ["zfcssh_client*"]
